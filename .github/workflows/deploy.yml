name: Deploy to GitHub Pages

# 默认站点部署在自定义域名（EdgeOne Pages），走这里只在需要 GitHub Pages 备份时手动触发
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # GitHub Pages 站点在 /youngke-blog 子路径下，构建时必须带前缀
          DEPLOY_TARGET: github-pages

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # 首次部署时仓库的 Pages 还没启用，让这一步顺带创建
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
